[package]
name = "calvin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Learn how you use AI coding agents, from the logs they already write."
license = "MIT"
repository = "https://github.com/jmelosegui/calvin"
readme = "README.md"
keywords = ["ai", "claude", "analytics", "cli", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
getrandom = "0.4.3"
ignore = "0.4.33"
indicatif = "0.18.6"
open = "5.4.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
