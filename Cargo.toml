[package]
name = "calvin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
indicatif = "0.18.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
walkdir = "2.5.0"
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
