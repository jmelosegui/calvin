# Bundled API list prices, USD per million tokens.
#
# These are Anthropic first-party API rates. They are an *estimate* of what usage would cost
# at list price: subscription plans are flat-rate, and cloud providers or proxies may price
# differently. Override or extend in your own config.toml under [prices.models."<id>"].
#
# Cache prices not listed per model use the multipliers below (relative to input price).
# Source: Anthropic model pricing as of 2026-06-24. Update via pull request.

[multipliers]
cache_write_5m = 1.25
cache_write_1h = 2.0
cache_read = 0.1

[models."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_read = 0.25

